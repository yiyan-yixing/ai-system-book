"docs_dir": ".site-src"
"site_dir": ".site-build"
"use_directory_urls": false
"theme":
  "name": "material"
  "language": "zh"
  "font": false
  "custom_dir": "overrides"
  "logo": "assets/mark.svg"
  "favicon": "assets/favicon.svg"
  "palette":
    - "scheme": "default"
      "primary": "custom"
      "accent": "custom"
      "toggle":
        "icon": "material/weather-night"
        "name": "浅色 / 深色"
    - "scheme": "slate"
      "primary": "custom"
      "accent": "custom"
      "toggle":
        "icon": "material/weather-sunny"
        "name": "深色 / 浅色"
  "features":
    - "navigation.instant"
    - "navigation.tracking"
    - "navigation.sections"
    - "navigation.indexes"
    - "navigation.top"
    - "navigation.footer"
    - "toc.follow"
    - "search.highlight"
    - "search.suggest"
    - "search.share"
    - "content.code.copy"
    - "content.tabs.link"
"plugins":
  - "search":
      "lang":
        - "zh"
        - "en"
"markdown_extensions":
  - "admonition"
  - "attr_list"
  - "md_in_html"
  - "footnotes"
  - "tables"
  - "toc":
      "permalink": true
      "slugify": !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - "pymdownx.superfences"
  - "pymdownx.highlight":
      "anchor_linenums": true
  - "pymdownx.inlinehilite"
  - "pymdownx.details"
  - "pymdownx.tabbed":
      "alternate_style": true
  - "pymdownx.caret"
  - "pymdownx.mark"
  - "pymdownx.tilde"
  - "pymdownx.smartsymbols"
"extra_css":
  - "assets/mechanics.css"
  - "assets/theme.css"
